<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fieldscope</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main>
    <nav id="scenes" class="scenes"></nav>
    <header>
      <h1>Fieldscope</h1>
      <p>Drag the probe. The arrow points where T rises fastest.</p>
    </header>
    <div class="stage"><canvas id="field"></canvas></div>
    <section class="cards">
      <div class="card"><span class="label">Position</span><span id="pos" class="val"></span></div>
      <div class="card"><span class="label">T</span><span id="temp" class="val"></span></div>
      <div class="card"><span class="label">∇T</span><span id="grad" class="val"></span></div>
      <div class="card"><span class="label">|∇T|</span><span id="mag" class="val"></span></div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
