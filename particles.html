<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fieldscope · Particles</title>
  <script type="module" crossorigin src="./assets/particles-Do_7LAEE.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/nav-DDxvBEIb.js">
  <link rel="stylesheet" crossorigin href="./assets/nav-B2-Jns2k.css">
</head>
<body>
  <main>
    <nav id="scenes" class="scenes"></nav>
    <header>
      <h1>Fieldscope</h1>
      <p id="caption"></p>
    </header>
    <div class="stage dark" id="stage"></div>
    <section class="controls top">
      <div class="row" data-scenes="2 3 4"><button id="play">Pause</button><button id="reset">Reset to rest</button></div>
      <label data-scenes="4"><span>Zoom: <b id="zv"></b> mm from the tracer</span>
        <input id="z" type="range" min="0" max="100" step="0.5" value="50" /></label>
      <label class="check" data-scenes="4"><input id="cam" type="checkbox" /> <span>Camera follows the tracer</span></label>
    </section>
    <section class="cards" aria-label="Tracer" data-scenes="3 4">
      <div class="card"><span class="label">Tracer · position</span><span id="tpos" class="val"></span></div>
      <div class="card"><span class="label">Velocity u</span><span id="tvel" class="val"></span></div>
      <div class="card"><span class="label">Speed</span><span id="tspd" class="val"></span></div>
      <div class="card"><span class="label">T here</span><span id="ttemp" class="val"></span></div>
    </section>
    <section class="controls">
      <label data-scenes="3 4"><span>Extra tracers: <b id="xv">0</b></span>
        <input id="x" type="range" min="0" max="50" step="1" value="0" /></label>
      <label class="check" data-scenes="3 4"><input id="dim" type="checkbox" checked /> <span>Dim the other particles</span></label>
      <label data-scenes="2 3 4"><span>Flow speed: <b id="uv"></b> mm/s</span>
        <input id="u" type="range" min="5" max="150" step="5" value="40" /></label>
      <label><span>Cells per side: <b id="nv"></b> (<span id="count"></span> particles)</span>
        <input id="n" type="range" min="6" max="40" step="1" value="24" /></label>
      <label><span>Particle size: <b id="sv"></b></span>
        <input id="s" type="range" min="1" max="12" step="0.5" value="5" /></label>
    </section>
  </main>
</body>
</html>
